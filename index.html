<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode</title>

    <link rel="stylesheet" href="styles.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <main class="maintenance">

        <div class="card">

            <!-- LEFT -->
            <section class="content">

                <div class="logo">
                    <span>Tessy Galaxy</span>
                </div>

                <div class="message">

                    <h1>
                        We are
                        <span>tidying up!</span>
                    </h1>

                    <p class="subtitle">
                        Sorry for the inconvenience!
                    </p>

                    <p class="description">
                        Currently updating the business to improve service.<br>
                        Thank you for your patience!
                    </p>

                    <p class="countdown">
                        Your beloved site will be available in:
                        <strong id="countdown">Loading...</strong>
                    </p>

                </div>

                <div class="socials">
                    <p>Visit us on social:</p>

                    <div class="social-icons">
                        <a href="https://www.instagram.com/tessygalaxy/" target="_blank"><i class="fab fa-instagram"></i></a>
                        <a href="https://web.facebook.com/people/Tessy-Galaxy/61576176755120/" target="_blank"><i class="fab fa-facebook-f"></i></a>
                        <a href="https://wa.me/2348062380569" target="_blank"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>

            </section>


            <!-- RIGHT -->
            <section class="illustration">

                <div class="leaves leaves-one"></div>
                <div class="leaves leaves-two"></div>

                <!-- gears -->
                <div class="gear gear-orange">⚙</div>
                <div class="gear gear-green">⚙</div>

                <!-- server -->
                <div class="server">

                    <div class="server-slot">
                        <div class="bars">
                            <i></i><i></i><i></i><i></i><i></i>
                        </div>
                    </div>

                    <div class="server-slot">
                        <div class="bars">
                            <i></i><i></i><i></i><i></i><i></i>
                        </div>
                    </div>

                    <div class="server-slot">
                        <div class="bars">
                            <i></i><i></i><i></i><i></i><i></i>
                        </div>
                    </div>

                    <div class="server-slot">
                        <div class="bars">
                            <i></i><i></i><i></i><i></i><i></i>
                        </div>
                    </div>

                    <div class="server-slot">
                        <div class="bars">
                            <i></i><i></i><i></i><i></i><i></i>
                        </div>
                    </div>

                </div>

                <!-- PERSON ON LAPTOP -->
                <div class="person person-one">
                    <div class="head"></div>
                    <div class="hair"></div>
                    <div class="body"></div>
                    <div class="arm"></div>
                </div>

                <div class="desk">
                    <div class="laptop">
                        <div class="screen"></div>
                    </div>

                    <div class="desk-top"></div>
                    <div class="desk-leg left"></div>
                    <div class="desk-leg right"></div>
                </div>


                <!-- LADDER -->
                <div class="ladder">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <!-- PERSON ON LADDER -->
                <div class="person person-two">
                    <div class="head"></div>
                    <div class="hair"></div>
                    <div class="body"></div>
                    <div class="arm"></div>
                </div>

                <!-- PLANT -->
                <div class="plant">
                    <div class="pot"></div>
                    <div class="leaf leaf-a"></div>
                    <div class="leaf leaf-b"></div>
                    <div class="leaf leaf-c"></div>
                </div>

            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
